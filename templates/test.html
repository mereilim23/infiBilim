<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тест - ИнфоБілім</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #6366f1;
        --secondary: #8b5cf6;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text-dark: #1e293b;
        --text-light: #64748b;
        --bg-gradient: linear-gradient(135deg, #faf5ff 0%, #f0f9ff 100%);
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--text-dark);
        line-height: 1.6;
        background: var(--bg-gradient);
        min-height: 100vh;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* Header */
      .header {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(20px);
        padding: 20px 0;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 20px rgba(99, 102, 241, 0.1);
        border-bottom: 1px solid rgba(99, 102, 241, 0.1);
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }

      .logo-text {
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .nav-right {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .back-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .back-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
      }

      /* Main Content */
      .main-content {
        padding: 40px 0;
      }

      /* Test Header */
      .test-header {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(248, 249, 255, 0.9) 100%
        );
        backdrop-filter: blur(20px);
        padding: 32px;
        border-radius: 20px;
        margin-bottom: 32px;
        border: 2px solid rgba(99, 102, 241, 0.1);
        box-shadow: 0 8px 32px rgba(99, 102, 241, 0.15);
      }

      .test-title {
        font-size: 28px;
        font-weight: 800;
        color: var(--text-dark);
        margin-bottom: 20px;
      }

      .progress-info {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .progress-info span {
        font-weight: 700;
        color: var(--primary);
        min-width: 60px;
      }

      .progress-bar {
        flex: 1;
        height: 8px;
        background: rgba(99, 102, 241, 0.1);
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        border-radius: 10px;
        transition: width 0.5s ease;
      }

      /* Test Container */
      .test-container {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(248, 249, 255, 0.9) 100%
        );
        backdrop-filter: blur(20px);
        padding: 40px;
        border-radius: 20px;
        border: 2px solid rgba(99, 102, 241, 0.1);
        box-shadow: 0 8px 32px rgba(99, 102, 241, 0.15);
      }

      .question-card {
        margin-bottom: 32px;
      }

      .question-text {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 28px;
        line-height: 1.5;
      }

      /* Answers Grid */
      .answers-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-bottom: 32px;
      }

      .answer-option {
        display: flex;
        align-items: center;
        padding: 16px;
        border: 2px solid rgba(99, 102, 241, 0.2);
        border-radius: 12px;
        background: white;
        cursor: pointer;
        transition: all 0.3s ease;
        gap: 12px;
      }

      .answer-option:hover {
        border-color: var(--primary);
        background: rgba(99, 102, 241, 0.05);
        transform: translateX(4px);
      }

      .answer-option input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border: 2px solid var(--primary);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s ease;
        flex-shrink: 0;
      }

      .answer-option input[type="radio"]:hover {
        background: rgba(99, 102, 241, 0.1);
      }

      .answer-option input[type="radio"]:checked {
        background: var(--primary);
        box-shadow: inset 0 0 0 4px white;
      }

      .answer-option.selected {
        border-color: var(--primary);
        background: rgba(99, 102, 241, 0.1);
      }

      .answer-text {
        font-size: 15px;
        font-weight: 500;
        color: var(--text-dark);
        line-height: 1.4;
        word-break: break-word;
      }

      /* Test Navigation */
      .test-nav {
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-secondary {
        background: white;
        color: var(--primary);
        border: 2px solid var(--primary);
      }

      .btn-secondary:hover {
        background: rgba(99, 102, 241, 0.1);
        transform: translateY(-2px);
      }

      .btn-secondary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-success {
        background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      }

      .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10000;
        padding: 20px;
        overflow-y: auto;
      }

      .modal.show {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .modal-content {
        background: white;
        border-radius: 20px;
        max-width: 800px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.4s ease;
      }

      @keyframes slideUp {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .results-header {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        padding: 32px;
        border-radius: 20px 20px 0 0;
      }

      .results-header h2 {
        font-size: 28px;
        font-weight: 800;
        margin: 0;
      }

      .results-body {
        padding: 40px;
        max-height: 60vh;
        overflow-y: auto;
      }

      .score-circle {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
      }

      .score-value {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.1) 0%,
          rgba(139, 92, 246, 0.1) 100%
        );
        border: 4px solid var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        font-weight: 800;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .result-message {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 32px;
        line-height: 1.5;
      }

      /* Modal Footer */
      .modal-footer {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        padding: 0 40px 40px;
        border-top: 2px solid rgba(99, 102, 241, 0.1);
      }

      /* Statistics Grid */
      .statistics-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin: 24px 0;
        padding: 20px;
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.05) 0%,
          rgba(139, 92, 246, 0.05) 100%
        );
        border-radius: 16px;
        border: 2px solid rgba(99, 102, 241, 0.1);
      }

      .stat-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        border-radius: 12px;
        background: white;
        border: 2px solid transparent;
        transition: all 0.3s ease;
      }

      .stat-box.correct {
        border-color: var(--success);
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.1) 0%,
          white 100%
        );
      }

      .stat-box.incorrect {
        border-color: var(--danger);
        background: linear-gradient(
          135deg,
          rgba(239, 68, 68, 0.1) 0%,
          white 100%
        );
      }

      .stat-box.total {
        border-color: var(--primary);
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.1) 0%,
          white 100%
        );
      }

      .stat-icon {
        font-size: 32px;
        line-height: 1;
      }

      .stat-data {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .stat-number {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-dark);
        line-height: 1;
      }

      .stat-label {
        font-size: 12px;
        color: var(--text-light);
        font-weight: 600;
        margin-top: 4px;
      }

      /* Review Container */
      .review-container {
        margin-top: 24px;
      }

      .review-container strong {
        display: block;
        margin-bottom: 16px;
        font-size: 16px;
        color: var(--text-dark);
      }

      .review-item {
        display: flex;
        gap: 16px;
        padding: 16px;
        margin-bottom: 12px;
        border-radius: 12px;
        background: white;
        border-left: 4px solid var(--primary);
        transition: all 0.3s ease;
      }

      .review-item.correct {
        border-left-color: var(--success);
        background: linear-gradient(
          90deg,
          rgba(16, 185, 129, 0.05) 0%,
          white 100%
        );
      }

      .review-item.incorrect {
        border-left-color: var(--danger);
        background: linear-gradient(
          90deg,
          rgba(239, 68, 68, 0.05) 0%,
          white 100%
        );
      }

      .review-item:hover {
        transform: translateX(4px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }

      .review-number {
        min-width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        border-radius: 8px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .review-content {
        flex: 1;
        min-width: 0;
      }

      .review-question {
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 12px;
        line-height: 1.5;
        word-break: break-word;
      }

      .review-answer-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .user-answer,
      .correct-answer {
        font-size: 14px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .answer-label {
        color: var(--text-light);
        font-weight: 600;
      }

      .user-answer strong {
        color: var(--text-dark);
        font-weight: 700;
      }

      .correct-answer strong {
        color: var(--success);
        font-weight: 700;
      }

      .status-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        height: 24px;
        border-radius: 50%;
        font-weight: 700;
        font-size: 14px;
      }

      .review-item.correct .status-icon {
        background: var(--success);
        color: white;
      }

      .review-item.incorrect .status-icon {
        background: var(--danger);
        color: white;
      }

      @media (max-width: 768px) {
        .test-header {
          padding: 24px;
        }

        .test-container {
          padding: 24px;
        }

        .question-text {
          font-size: 18px;
        }

        .test-nav {
          flex-wrap: wrap;
        }

        .btn {
          flex: 1;
          min-width: 120px;
        }

        .modal-content {
          margin: 20px;
        }

        .results-body {
          padding: 24px;
        }

        .modal-footer {
          padding: 0 24px 24px;
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }

        .statistics-grid {
          grid-template-columns: 1fr;
          gap: 12px;
          margin: 20px 0;
          padding: 16px;
        }

        .review-item {
          flex-direction: column;
          gap: 12px;
        }
      }

        /* ===== АДАПТАЦИЯ test.html ===== */
        @media (max-width: 767px) {
            .container { padding: 0 16px; }
        }

    </style>
  </head>
  <body class="test-page">
    <!-- Header -->
    <header class="header">
      <div class="container">
        <nav class="navbar">
          <div class="logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
              <path
                d="M8 3L4 7L8 11"
                stroke="url(#logo-gradient)"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <path
                d="M16 3L20 7L16 11"
                stroke="url(#logo-gradient)"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <path
                d="M14 3L10 11"
                stroke="url(#logo-gradient)"
                stroke-width="2.5"
                stroke-linecap="round"
              />
              <defs>
                <linearGradient
                  id="logo-gradient"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="100%"
                >
                  <stop offset="0%" style="stop-color: #6366f1" />
                  <stop offset="100%" style="stop-color: #8b5cf6" />
                </linearGradient>
              </defs>
            </svg>
            <span class="logo-text">InfoBilim</span>
          </div>
          <div class="nav-right">
            <a
              href="#"
              class="back-btn"
              id="backBtn"
              onclick="
                goBack();
                return false;
              "
            >
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path
                  d="M12 16L6 10L12 4"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              Артқа қайту
            </a>
          </div>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container">
        <!-- Test Header -->
        <div class="test-header">
          <h1 class="test-title" id="testTitle">Тест сұрақтары</h1>
          <div class="progress-info">
            <span id="questionCount">1 / 5</span>
            <div class="progress-bar">
              <div
                class="progress-fill"
                id="progressFill"
                style="width: 20%"
              ></div>
            </div>
          </div>
        </div>

        <!-- Test Content -->
        <div class="test-container">
          <div class="question-card" id="questionCard">
            <h2 class="question-text" id="questionText">Сұрақ жүктелуде...</h2>
            <div class="answers-grid" id="answersGrid">
              <!-- Answers will be inserted here by JS -->
            </div>
          </div>

          <!-- Navigation -->
          <div class="test-nav">
            <button class="btn btn-secondary" id="prevBtn" disabled>
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M11 14L5 9L11 4"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
              Алдыңғы
            </button>
            <button class="btn btn-primary" id="nextBtn">
              Келесі
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M7 4L13 9L7 14"
                  stroke="white"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>

          <!-- Finish Button -->
          <button
            class="btn btn-success"
            id="finishBtn"
            style="display: none; width: 100%"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path
                d="M3 9L7 13L15 5"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Тестты аяқтау
          </button>
        </div>

        <!-- Results Modal -->
        <div class="modal" id="resultsModal">
          <div class="modal-content">
            <div class="results-header">
              <h2>📊 Тест нәтижелері</h2>
            </div>
            <div class="results-body">
              <div class="score-circle">
                <div class="score-value"><span id="finalScore">0</span>%</div>
              </div>
              <p id="resultMessage" class="result-message">Өте жақсы!</p>

              <!-- Statistics -->
              <div class="statistics-grid">
                <div class="stat-box correct">
                  <div class="stat-icon">✓</div>
                  <div class="stat-data">
                    <span class="stat-number" id="correctCount">0</span>
                    <span class="stat-label">дұрыс</span>
                  </div>
                </div>
                <div class="stat-box incorrect">
                  <div class="stat-icon">✗</div>
                  <div class="stat-data">
                    <span class="stat-number" id="incorrectCount">0</span>
                    <span class="stat-label">қате</span>
                  </div>
                </div>
                <div class="stat-box total">
                  <div class="stat-icon">📋</div>
                  <div class="stat-data">
                    <span class="stat-number" id="totalCount">0</span>
                    <span class="stat-label">барлығы</span>
                  </div>
                </div>
              </div>

              <div class="answer-review" id="answerReview"></div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-primary" id="backToTopicBtn">
                ← Тақырыпқа қайту
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/static/js/test.js"></script>
    <script>
      // Get topic from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const topicParam = urlParams.get("topic");

      if (topicParam) {
        sessionStorage.setItem("topicNumber", topicParam);
      }

      function goBack() {
    const sectionId = sessionStorage.getItem("sectionId");
    if (sectionId && sectionId !== 'null') {
        window.location.href = "/topic_7_" + sectionId + "bolim";
    } else {
        window.location.href = "/glav";
    }
}
    </script>
  </body>
</html>
