<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу - ИнфоБілім</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --border: rgba(99, 102, 241, 0.25);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
            justify-content: center;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 28px;
        }

        .error-message {
            background: linear-gradient(135deg, #fee2e2, #fecaca);
            border-left: 4px solid #ef4444;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .auth-form { display: flex; flex-direction: column; gap: 18px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            color: var(--text-dark);
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .form-input::placeholder { color: #94a3b8; }

        .password-wrapper { position: relative; }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover { color: var(--primary); }

        .password-strength {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 4px;
        }

        .strength-bar {
            height: 3px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 12px;
            font-weight: 500;
        }

        /* Role selector */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .role-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 14px 12px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            background: #fff;
            user-select: none;
            transition: all 0.2s;
            text-align: center;
        }

        .role-option:hover {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(99, 102, 241, 0.03);
        }

        .role-option.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.08));
        }

        .role-title { font-size: 14px; font-weight: 700; color: var(--text-dark); }
        .role-desc { font-size: 11px; color: var(--text-light); }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .auth-switch {
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
        }

        .auth-switch a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .auth-switch a:hover { color: var(--secondary); }

        @media (max-width: 480px) {
            .card { padding: 32px 20px; }
            .auth-title { font-size: 20px; }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .card { max-width: 480px; padding: 40px 36px; }
        }
        @media (max-width: 767px) {
            .card { padding: 28px 20px; border-radius: 20px; }
            .auth-title { font-size: 22px; }
            .form-input { padding: 12px 14px; font-size: 14px; }
            .submit-btn { padding: 13px; }
        }
        @media (max-width: 380px) {
            .card { padding: 24px 16px; }
            .auth-title { font-size: 19px; }
        }

    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
                    <svg width="42" height="42" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#4f46e5"/>
                                <stop offset="100%" style="stop-color:#7c3aed"/>
                            </linearGradient>
                        </defs>
                        <rect width="42" height="42" rx="10" fill="url(#hbg)"/>
                        <path d="M24 6 L18 22 L23 22 L18 36 L30 18 L24 18 L28 6 Z" fill="white" opacity="0.9"/>
                        <path d="M10 10 L7 18 L11 18 L9 26 L17 14 L12 14 L14 10 Z" fill="white" opacity="0.25"/>
                    </svg>
                    <span class="logo-text">InfoBilim</span>
                </div>

        <h1 class="auth-title">Тіркелу</h1>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form class="auth-form" method="POST" action="/register">
            <div class="form-group">
                <label for="name" class="form-label">Толық аты</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    class="form-input"
                    placeholder="Арман Нұрланұлы"
                    value="{{ name if name else '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Логин</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="логин"
                    value="{{ username if username else '' }}"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Құпия сөз</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="••••••••"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 4C5 4 2 10 2 10C2 10 5 16 10 16C15 16 18 10 18 10C18 10 15 4 10 4Z" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-text" id="strengthText">Кем дегенде 6 таңба</span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Құпия сөзді растау</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        class="form-input"
                        placeholder="••••••••"
                        required
                        autocomplete="new-password"
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                        <svg class="eye-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M10 4C5 4 2 10 2 10C2 10 5 16 10 16C15 16 18 10 18 10C18 10 15 4 10 4Z" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Рөлді таңдаңыз</label>
                <div class="role-selector">
                    <label class="role-option active" id="role-student-label">
                        <input type="radio" name="role" value="student" checked style="display:none;">
                        <span class="role-title">Оқушы</span>
                        <span class="role-desc">Курстарды оқу</span>
                    </label>
                    <label class="role-option" id="role-teacher-label">
                        <input type="radio" name="role" value="teacher" style="display:none;">
                        <span class="role-title">Мұғалім</span>
                        <span class="role-desc">Сыныпты басқару</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="submit-btn">Тіркелу</button>

            <p class="auth-switch">
                Аккаунтыңыз бар ма? <a href="/login">Кіру</a>
            </p>
        </form>
    </div>

    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                if (icon) icon.style.opacity = '0.4';
            } else {
                input.type = 'password';
                if (icon) icon.style.opacity = '1';
            }
        }

        // Password strength
        const passwordInput = document.getElementById('password');
        passwordInput.addEventListener('input', function() {
            const password = this.value;
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            const percentage = (strength / 5) * 100;
            let label = '', color = '';
            if (strength === 0)      { label = 'Кем дегенде 6 таңба'; color = '#94a3b8'; }
            else if (strength <= 2)  { label = 'Әлсіз құпия сөз';     color = '#ef4444'; }
            else if (strength <= 3)  { label = 'Орташа құпия сөз';    color = '#f59e0b'; }
            else                     { label = 'Күшті құпия сөз';      color = '#10b981'; }

            strengthFill.style.width = percentage + '%';
            strengthFill.style.background = color;
            strengthText.textContent = label;
            strengthText.style.color = color;
        });

        // Confirm password
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            this.style.borderColor = (this.value && this.value !== password) ? '#ef4444' : '';
        });

        // Role selector
        document.querySelectorAll('.role-option').forEach(label => {
            label.addEventListener('click', function() {
                document.querySelectorAll('.role-option').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                this.querySelector('input[type="radio"]').checked = true;
            });
        });
    </script>
</body>
</html>
