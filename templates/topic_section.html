<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бөлім - ИнфоБілім</title>
    <link rel="stylesheet" href="../static/topicsstyle.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                        <path d="M8 3L4 7L8 11" stroke="url(#logo-gradient)" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M16 3L20 7L16 11" stroke="url(#logo-gradient)" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M14 3L10 11" stroke="url(#logo-gradient)" stroke-width="2.5" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#6366f1"/>
                                <stop offset="100%" style="stop-color:#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="logo-text">ИнфоБілім</span>
                </div>
                <div class="nav-right">
                    <a href="/profile" class="user-menu">
                        <div class="user-info">
                            <div class="user-avatar">{{ user_name[0] | upper }}</div>
                            <span>{{ user_name }}</span>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="white">
                                <path d="M4 6L8 10L12 6" stroke="white" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </div>
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <section class="breadcrumb">
        <div class="container">
            <div class="breadcrumb-content">
                <a href="/glav" class="breadcrumb-link">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M7 13L3 9L7 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Басты бетке
                </a>
            </div>
        </div>
    </section>

    <main class="main-content">
        <div class="container">
            <div class="course-header" id="courseHeader">
                <!-- Dynamically filled -->
            </div>

            <div class="progress-section">
                <div class="progress-header">
                    <h3>Жалпы прогресс</h3>
                    <span class="progress-percent" id="totalProgress">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="totalProgressFill" style="width: 0%"></div>
                    </div>
                </div>
                <p class="progress-text" id="progressText">0 тақырыптан 0 аяқталды</p>
            </div>

            <div class="topics-section">
                <h2 class="section-title">Тақырыптар</h2>
                <div class="topics-grid" id="topicsGrid">
                    <!-- Topics will be generated by JavaScript -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Данные по разделам
        const sectionsData = {
            1: {
                name: 'Компьютерлік жад және оның өлшем бірліктері',
                icon: '💾',
                badge: '1-бөлім',
                description: 'Компьютер жадының түрлері, өлшем бірліктері және ақпаратты сақтау принциптері',
                topics: {
                    1: { title: 'Компьютер жадының негіздері', globalId: 1 },
                    2: { title: 'Ақпарат өлшем бірліктері', globalId: 2 },
                    3: { title: 'Жад түрлері: RAM және ROM', globalId: 3 },
                    4: { title: 'Сыртқы жады құрылғылары', globalId: 4 },
                    5: { title: 'Файлдық жүйе', globalId: 5 }
                }
            },
            2: {
                name: 'Желі және қауіпсіздік',
                icon: '🌐',
                badge: '2-бөлім',
                description: 'Компьютерлік желілер, интернет және қауіпсіздік негіздері',
                topics: {
                    1: { title: 'Компьютерлік желілер негіздері', globalId: 6 },
                    2: { title: 'Интернет және оның қызметтері', globalId: 7 },
                    3: { title: 'Желілік протоколдар', globalId: 8 },
                    4: { title: 'Ақпараттық қауіпсіздік', globalId: 9 },
                    5: { title: 'Вирустар және антивирустар', globalId: 10 }
                }
            },
            3: {
                name: 'Электрондық кесте арқылы есептер шығару',
                icon: '📊',
                badge: '3-бөлім',
                description: 'Microsoft Excel, формулалар, диаграммалар және деректерді талдау',
                topics: {
                    1: { title: 'Excel негіздері', globalId: 11 },
                    2: { title: 'Формулалар және функциялар', globalId: 12 },
                    3: { title: 'Диаграммалар құру', globalId: 13 },
                    4: { title: 'Деректерді сұрыптау және сүзу', globalId: 14 },
                    5: { title: 'Күрделі есептер шығару', globalId: 15 }
                }
            },
            4: {
                name: 'Python тіліндегі алгоритмдерді программалау',
                icon: '🐍',
                badge: '4-бөлім',
                description: 'Python тіліндегі алгоритмдерді үйреніңіз: файлдармен жұмыс, функциялар, шарттар',
                topics: {
                    1: { title: 'Файлдармен жұмыс', globalId: 16 },
                    2: { title: 'Файлдық функциялармен жұмыс', globalId: 17 },
                    3: { title: 'Тармақталған алгоритмдерді программалау', globalId: 18 },
                    4: { title: 'Кірістірілген шарттарды программалау', globalId: 19 },
                    5: { title: 'Құрамды шарттарды программалау', globalId: 20 }
                }
            },
            5: {
                name: 'Практикалық программалау',
                icon: '💻',
                badge: '5-бөлім',
                description: 'Программалау дағдыларын жетілдіру, жобалар жасау',
                topics: {
                    1: { title: 'Функцияларды құру', globalId: 21 },
                    2: { title: 'Модульдермен жұмыс', globalId: 22 },
                    3: { title: 'Қателермен жұмыс', globalId: 23 },
                    4: { title: 'Кіші жобалар', globalId: 24 },
                    5: { title: 'Қорытынды жоба', globalId: 25 }
                }
            }
        };

        // Получаем ID раздела из URL
        const urlParams = new URLSearchParams(window.location.search);
        const sectionId = parseInt(urlParams.get('id')) || 1;
        const classLevel = 7;

        const section = sectionsData[sectionId];

        async function loadProgress() {
            try {
                const response = await fetch(`/api/user-progress?class_level=${classLevel}`);
                const data = await response.json();
                const sectionProgress = data.progress[sectionId];

                if (sectionProgress && sectionProgress.topics) {
                    const completedMap = {};
                    sectionProgress.topics.forEach(t => {
                        completedMap[t.topic_id] = t.percentage;
                    });
                    return completedMap;
                }
                return {};
            } catch (error) {
                console.error('Error loading progress:', error);
                return {};
            }
        }

        function getTopicStatus(percentage) {
            if (percentage >= 70) {
                return { class: 'excellent', text: '✅ Аяқталды', badge: 'excellent-badge', badgeText: 'Тамаша! 🎉' };
            } else if (percentage > 0) {
                return { class: 'progress', text: '📚 Үдерісте', badge: 'good-badge', badgeText: 'Жалғастыру' };
            } else {
                return { class: 'available', text: '🚀 Бастау', badge: '', badgeText: '' };
            }
        }

        async function renderPage() {
            // Render header
            const headerDiv = document.getElementById('courseHeader');
            if (headerDiv) {
                headerDiv.innerHTML = `
                    <div class="course-icon">${section.icon}</div>
                    <div class="course-info">
                        <div class="course-badge">${section.badge}</div>
                        <h1 class="course-title">${section.name}</h1>
                        <p class="course-description">${section.description}</p>
                    </div>
                    <div class="course-stats">
                        <div class="stat-item">
                            <div class="stat-icon">📝</div>
                            <div class="stat-info">
                                <h3>${Object.keys(section.topics).length}</h3>
                                <p>Тақырып</p>
                            </div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-icon">✓</div>
                            <div class="stat-info">
                                <h3>${Object.keys(section.topics).length * 10}</h3>
                                <p>Тест сұрақтары</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Load progress
            const completedMap = await loadProgress();

            // Calculate total progress
            const totalTopics = Object.keys(section.topics).length;
            let completedCount = 0;
            let totalPercentage = 0;

            for (const [topicId, topic] of Object.entries(section.topics)) {
                const percentage = completedMap[topic.globalId] || 0;
                if (percentage >= 70) completedCount++;
                totalPercentage += percentage;
            }

            const avgPercentage = totalTopics > 0 ? Math.round(totalPercentage / totalTopics) : 0;

            // Update progress bar
            document.getElementById('totalProgress').textContent = avgPercentage + '%';
            document.getElementById('totalProgressFill').style.width = avgPercentage + '%';
            document.getElementById('progressText').textContent =
                `${totalTopics} тақырыптан ${completedCount} аяқталды`;

            // Render topics grid
            const grid = document.getElementById('topicsGrid');
            grid.innerHTML = '';

            for (const [topicId, topic] of Object.entries(section.topics)) {
                const percentage = completedMap[topic.globalId] || 0;
                const status = getTopicStatus(percentage);

                const topicCard = document.createElement('div');
                topicCard.className = `topic-card ${status.class}`;
                topicCard.innerHTML = `
                    <div class="topic-number">${topicId}</div>
                    <div class="topic-content">
                        <div class="topic-header">
                            <h3 class="topic-title">${topic.title}</h3>
                            <div class="topic-status ${status.class}-status">
                                ${percentage > 0 ? `<span>${percentage}%</span>` : ''}
                                <span>${status.text}</span>
                            </div>
                        </div>
                        <p class="topic-description">
                            10 тест сұрақтары
                        </p>
                        <div class="topic-footer">
                            <div class="topic-meta">
                                <span class="meta-item">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                        <path d="M8 2L10 6L14 6.5L11 9.5L11.5 13.5L8 11.5L4.5 13.5L5 9.5L2 6.5L6 6L8 2Z"/>
                                    </svg>
                                    10 тест
                                </span>
                                <span class="meta-item">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                        <circle cx="8" cy="8" r="6"/>
                                        <path d="M8 4V8L11 10" stroke="white" stroke-width="1.5"/>
                                    </svg>
                                    30 мин
                                </span>
                            </div>
                            ${status.badge ? `<div class="score-badge ${status.badge}">${status.badgeText}</div>` : ''}
                            <button class="topic-btn start-btn" data-global-id="${topic.globalId}" data-topic-title="${topic.title}">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                                    <path d="M6 4L14 9L6 14V4Z" fill="currentColor"/>
                                </svg>
                                ${percentage > 0 ? 'Жалғастыру' : 'Бастау'}
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(topicCard);
            }

            // Add click handlers
            document.querySelectorAll('.topic-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const globalTopicId = btn.dataset.globalId;
                    const topicTitle = btn.dataset.topicTitle;

                    sessionStorage.setItem('topicNumber', globalTopicId);
                    sessionStorage.setItem('topicTitle', topicTitle);
                    sessionStorage.setItem('sectionId', sectionId);
                    sessionStorage.setItem('classLevel', classLevel);

                    window.location.href = '/test';
                });
            });
        }

        document.addEventListener('DOMContentLoaded', renderPage);
    </script>
</body>
</html>
